<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra trạng thái GitHub</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #status { font-weight: bold; font-size: 20px; padding: 10px; display: inline-block; border-radius: 5px; }
        .dang-chay { color: #155724; background-color: #d4edda; }
        .dang-loi { color: #721c24; background-color: #f8d7da; }
        .dang-tai { color: #856404; background-color: #fff3cd; }
    </style>
</head>
<body>

    <h2>Trạng thái hoạt động của GitHub:</h2>
    <!-- Nơi hiển thị kết quả -->
    <div id="status" class="dang-tai">⏳ Đang kiểm tra...</div>

    <script>
        async function kiemTraGitHub() {
            const statusDiv = document.getElementById('status');
            // Sử dụng API của GitHub để tránh lỗi chặn kết nối (CORS)
            const url = "https://github.com"; 

            try {
                const response = await fetch(url);
                
                if (response.ok) {
                    statusDiv.innerText = "✅ GitHub đang chạy bình thường!";
                    statusDiv.className = "dang-chay";
                } else {
                    statusDiv.innerText = `❌ GitHub phản hồi lỗi (Mã: ${response.status})`;
                    statusDiv.className = "dang-loi";
                }
            } catch (error) {
                statusDiv.innerText = "❌ Không thể kết nối tới GitHub (Có thể bạn mất mạng hoặc GitHub sập)";
                statusDiv.className = "dang-loi";
            }
        }

        // Tự động chạy kiểm tra ngay khi trang index được tải xong
        window.onload = kiemTraGitHub;
    </script>

</body>
</html>
